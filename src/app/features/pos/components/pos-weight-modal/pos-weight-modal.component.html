@if (isOpen) {
  <div class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in duration-150">
    <div class="bg-slate-900 border-2 border-slate-800 w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4 animate-in zoom-in-95 duration-150">
      <h2 class="text-sm font-black text-slate-100 uppercase tracking-wide">ΕΙΣΑΓΩΓΗ ΒΑΡΟΥΣ (KG)</h2>
      
      <div class="text-center space-y-1">
        <h3 class="text-lg font-black text-emerald-400 truncate">{{ product?.name || 'Ζυγιζόμενο Προϊόν' }}</h3>
        <p class="text-sm font-mono text-slate-400">€{{ (product?.price || 0).toFixed(2) }} / kg</p>
      </div>

      <input 
        type="number" 
        step="0.05" 
        min="0.001"
        [ngModel]="inputWeightKg()" 
        (ngModelChange)="inputWeightKg.set($event)" 
        (keydown.enter)="handleConfirm()"
        class="w-full h-14 bg-slate-950 border-2 border-emerald-500 text-center font-mono font-black text-2xl text-emerald-400 rounded-xl focus:outline-none"
        autofocus
      />

      <div class="grid grid-cols-4 gap-2">
        @for (w of [0.250, 0.500, 1.000, 2.000]; track w) {
          <button 
            type="button" 
            (click)="setPresetWeight(w)" 
            class="h-10 bg-slate-950 border border-slate-800 hover:border-slate-700 font-mono font-bold text-xs text-slate-200 rounded-xl cursor-pointer transition active:scale-95">
            {{ w.toFixed(3) }}
          </button>
        }
      </div>

      <div class="flex gap-2.5 pt-2">
        <button 
          type="button" 
          (click)="close.emit()" 
          class="flex-1 h-12 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs cursor-pointer transition">
          Ακύρωση
        </button>
        <button 
          type="button" 
          (click)="handleConfirm()" 
          class="flex-1 h-12 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl text-sm shadow-lg cursor-pointer transition active:scale-95">
          Προσθήκη
        </button>
      </div>
    </div>
  </div>
}
