@if (isOpen) {
  <div class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in duration-150">
    <div class="bg-slate-900 border-2 border-slate-800 rounded-3xl w-full max-w-lg p-6 shadow-2xl space-y-4 font-mono animate-in zoom-in-95 duration-150">
      
      <div class="flex justify-between items-center pb-3 border-b border-slate-800">
        <h3 class="text-sm font-black text-amber-400 uppercase tracking-wider flex items-center gap-2">
          <span>👥 ΠΡΟΣΘΗΚΗ / ΔΙΑΧΕΙΡΙΣΗ ΠΡΟΣΩΠΙΚΟΥ</span>
        </h3>
        <button type="button" (click)="close.emit()" class="text-slate-400 hover:text-white font-bold cursor-pointer">✕</button>
      </div>

      <div class="p-4 bg-slate-950 border border-slate-800 rounded-2xl space-y-3">
        <h4 class="text-xs font-bold text-slate-300">Νέος Υπάλληλος</h4>
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">Όνομα &amp; Επώνυμο</label>
            <input 
              type="text" 
              [ngModel]="form().name"
              (ngModelChange)="form.set({ ...form(), name: $event })"
              placeholder="π.χ. Νίκος Παπαδόπουλος" 
              class="w-full h-10 bg-slate-900 border border-slate-700 rounded-xl px-3 text-xs text-white outline-none focus:border-amber-500"
            />
          </div>
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">4-Ψήφιο PIN Εισόδου</label>
            <input 
              type="password" 
              maxlength="6" 
              [ngModel]="form().pin"
              (ngModelChange)="form.set({ ...form(), pin: $event })"
              class="w-full h-10 bg-slate-900 border border-slate-700 rounded-xl px-3 text-xs text-white outline-none focus:border-amber-500"
            />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">Ρόλος / Δικαιώματα</label>
            <select 
              [ngModel]="form().role"
              (ngModelChange)="form.set({ ...form(), role: $event })"
              class="w-full h-10 bg-slate-900 border border-slate-700 rounded-xl px-2 text-xs text-slate-200 outline-none cursor-pointer"
            >
              <option value="CASHIER">Ταμίας (POS Only)</option>
              <option value="MANAGER">Υπεύθυνος Βάρδιας</option>
              <option value="ADMIN">Διαχειριστής / Ιδιοκτήτης</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">Κατάστημα</label>
            <input 
              type="text" 
              [ngModel]="form().storeId"
              (ngModelChange)="form.set({ ...form(), storeId: $event })"
              class="w-full h-10 bg-slate-900 border border-slate-700 rounded-xl px-3 text-xs text-slate-300 outline-none" 
              placeholder="π.χ. SHOP-01"
            />
          </div>
        </div>

        <button 
          type="button" 
          (click)="handleSave()" 
          class="w-full h-11 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs rounded-xl transition cursor-pointer shadow-lg shadow-amber-500/20 mt-2 active:scale-95"
        >
          + Αποθήκευση Υπαλλήλου
        </button>
      </div>

      <div class="space-y-1.5 max-h-48 overflow-y-auto pr-1 mt-4">
        <span class="text-[11px] text-slate-500 font-bold block">Εγγεγραμμένοι Χρήστες Καταστήματος:</span>
        @for (c of cashiers; track c.id) {
          <div class="flex items-center justify-between p-2.5 bg-slate-950/60 border border-slate-800 rounded-xl text-xs">
            <div>
              <span class="font-bold text-slate-200 block">{{ c.name }}</span>
              <span class="text-[10px] text-slate-400 font-mono flex items-center gap-1.5">
                <span class="text-emerald-400 font-bold">PIN: ••••</span>
                <span>•</span>
                <span class="px-1.5 py-0.2 rounded bg-slate-800 text-slate-300">{{ c.role }}</span>
                <span>•</span>
                <span class="text-slate-500">[{{ c.storeId || 'DEFAULT' }}]</span>
              </span>
            </div>
            <button 
              type="button" 
              (click)="toggleCashier.emit({ cashierId: c.id, status: false })" 
              class="text-rose-400 hover:text-rose-300 text-xs px-2 py-1 bg-rose-950/40 rounded border border-rose-900 cursor-pointer" 
              title="Διαγραφή / Απενεργοποίηση">
              🗑️️
            </button>
          </div>
        }
      </div>

    </div>
  </div>
}
