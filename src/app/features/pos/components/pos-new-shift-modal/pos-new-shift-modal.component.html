@if (isOpen) {
  <div class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 select-none animate-in fade-in duration-150">
    <div class="bg-slate-900 border border-slate-700/80 rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl text-center animate-in zoom-in-95 duration-150">
      
      <div class="w-14 h-14 rounded-2xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center mx-auto mb-3 text-3xl border border-emerald-500/20 shadow-inner">
        💵
      </div>
      <h2 class="text-xl font-black text-white tracking-tight">Έναρξη Νέας Βάρδιας</h2>
      <p class="text-xs text-slate-400 mt-1">Επιλέξτε ταμία και ορίστε το αρχικό ταμείο (μαγιά).</p>

      <!-- Cashier Selector -->
      <div class="my-4 text-left">
        <label class="text-xs font-semibold text-slate-300 block mb-2 font-mono">ΕΠΙΛΟΓΗ ΤΑΜΙΑ:</label>
        <div class="flex flex-wrap gap-2">
          @for (c of cashiers; track c.id) {
            <button 
              type="button" 
              (click)="selectCashier(c)" 
              [class.bg-sky-600]="selectedCashierId() === c.id" 
              [class.border-sky-400]="selectedCashierId() === c.id" 
              [class.text-white]="selectedCashierId() === c.id" 
              [class.bg-slate-800]="selectedCashierId() !== c.id" 
              [class.text-slate-300]="selectedCashierId() !== c.id" 
              class="px-3.5 py-2 rounded-xl text-xs font-bold transition border border-slate-700 hover:border-sky-500 cursor-pointer shadow-sm">
              {{ c.name }}
            </button>
          }
        </div>
      </div>

      <!-- PIN Input -->
      @if (selectedCashierId()) {
        <div class="my-3 text-left animate-in fade-in slide-in-from-top-2 duration-150">
          <label class="text-xs font-semibold text-slate-300 block mb-1 font-mono">PIN ΤΑΜΙΑ (4 ΨΗΦΙΑ):</label>
          <input 
            type="password" 
            maxlength="6" 
            inputmode="numeric" 
            [ngModel]="pin()" 
            (ngModelChange)="pin.set($event)" 
            (keydown.enter)="handleConfirm()" 
            placeholder="••••" 
            class="w-full h-11 bg-slate-950 border border-slate-700 focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20 rounded-xl px-4 text-center font-mono text-xl tracking-widest text-white outline-none transition"
          />
        </div>
      }

      <!-- Float Amount Input with Quick Presets -->
      <div class="my-4 text-left">
        <label class="text-xs font-semibold text-slate-300 block mb-1 font-mono">ΑΡΧΙΚΟ ΤΑΜΕΙΟ / ΜΑΓΙΑ (€):</label>
        <div class="relative">
          <input 
            type="number" 
            step="0.01" 
            min="0" 
            [ngModel]="openingFloat()" 
            (ngModelChange)="openingFloat.set($event)" 
            (keydown.enter)="handleConfirm()" 
            class="w-full h-12 bg-slate-950 border border-slate-700 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 rounded-xl pl-4 pr-10 text-xl font-mono font-bold text-emerald-400 focus:outline-none transition shadow-inner" 
            placeholder="0.00"
          />
          <span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 font-bold font-mono">€</span>
        </div>

        <div class="grid grid-cols-4 gap-1.5 mt-2">
          <button type="button" (click)="setFloatPreset(0)" class="h-8 rounded-lg bg-slate-800/80 hover:bg-slate-750 border border-slate-700 text-[11px] font-mono font-bold text-slate-300 cursor-pointer">€0</button>
          <button type="button" (click)="setFloatPreset(30)" class="h-8 rounded-lg bg-slate-800/80 hover:bg-slate-750 border border-slate-700 text-[11px] font-mono font-bold text-slate-300 cursor-pointer">€30</button>
          <button type="button" (click)="setFloatPreset(50)" class="h-8 rounded-lg bg-slate-800/80 hover:bg-slate-750 border border-slate-700 text-[11px] font-mono font-bold text-slate-300 cursor-pointer">€50</button>
          <button type="button" (click)="setFloatPreset(100)" class="h-8 rounded-lg bg-slate-800/80 hover:bg-slate-750 border border-slate-700 text-[11px] font-mono font-bold text-slate-300 cursor-pointer">€100</button>
        </div>
      </div>

      @if (errorMessage) {
        <div class="p-2.5 rounded-xl bg-rose-950/80 border border-rose-800/60 text-rose-300 text-xs font-mono mb-3">
          ⚠️ {{ errorMessage }}
        </div>
      }

      <!-- Action Buttons -->
      <div class="flex items-center gap-3 mt-5">
        <button 
          type="button" 
          (click)="lockTerminal.emit()" 
          class="flex-1 h-12 rounded-xl bg-slate-800 hover:bg-slate-750 text-slate-300 font-bold text-xs transition border border-slate-700 cursor-pointer">
          Κλείδωμα (PIN)
        </button>

        <button 
          type="button" 
          (click)="handleConfirm()" 
          class="flex-1 h-12 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-sm transition shadow-lg shadow-emerald-500/20 active:scale-95 cursor-pointer">
          Άνοιγμα Βάρδιας →
        </button>
      </div>

    </div>
  </div>
}
